name: Build ILIA AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q ILIA_AI_APK_BUILDER.zip

      - name: Build APK
        run: cd ILIA_AI_APK_BUILDER && gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ILIA-AI-APK
          path: ILIA_AI_APK_BUILDER/app/build/outputs/apk/debug/app-debug.apk
